plugins {
    id 'architectury-plugin' version '3.5.170'
    id 'dev.architectury.loom-no-remap' version '1.17.493' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.0' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0' apply false
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id 'me.shedaniel.unified-publishing' version '0.1.14' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    java {
        withSourcesJar()
    }
    kotlin {
        jvmToolchain(25)
        compilerOptions.moduleName.set("observable_${project.name}")
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.neoforged.net/releases/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:${rootProject.kotlin_serialization_version}"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${rootProject.kotlin_serialization_version}"
    }
}
