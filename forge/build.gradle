plugins {
    id 'com.gradleup.shadow'
    id 'me.shedaniel.unified-publishing'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    def kotlinLibraries = [
        "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_version}",
        "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:${rootProject.kotlin_serialization_version}",
        "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:${rootProject.kotlin_serialization_version}",
        "org.jetbrains.kotlinx:kotlinx-serialization-protobuf-jvm:${rootProject.kotlin_serialization_version}"
    ]
    kotlinLibraries.each { library ->
        forgeRuntimeLibrary(library) { transitive = false }
        include(library) { transitive = false }
    }

    common(project(':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) {
        transitive = false
    }
}

processResources {
    def metadata = [version: project.version, minecraft_version: rootProject.minecraft_version,
                    architectury_version: rootProject.architectury_version, neoforge_version: rootProject.neoforge_version]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shadowCommon]
    exclude 'fabric.mod.json'
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

loom.nestJars(tasks.named('shadowJar'), configurations.named('include'))

sourcesJar {
    from project(':common').sourceSets.main.allSource
}

unifiedPublishing {
    project {
        displayName = "$project.version (neoforge)"
        releaseType = "$rootProject.release_channel"
        changelog = "See Observable's GitHub releases page for all changes between versions."
        gameVersions = ["$project.minecraft_version"]
        gameLoaders = ["neoforge"]
        mainPublication shadowJar
        relations {
            depends {
                curseforge = "architectury-api"
                modrinth = "architectury-api"
            }
        }

        var CURSE_API_KEY = project.findProperty("CURSE_API_KEY") ?: System.getenv("CURSE_API_KEY")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = rootProject.curseforge_id
                gameVersions.addAll "Java 25"
            }
        }

        var MODRINTH_TOKEN = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = rootProject.modrinth_id
                version = "$project.version+neoforge"
            }
        }
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + '-' + project.name
            artifact tasks.named('shadowJar')
            artifact tasks.named('sourcesJar')
        }
    }
}
