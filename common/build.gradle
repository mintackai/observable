plugins {
    id 'org.jetbrains.kotlin.plugin.serialization'
}

architectury {
    common('neoforge', 'fabric')
}

dependencies {
    // Shared code uses the Fabric environment annotations and Mixin API.
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "dev.architectury:architectury:${rootProject.architectury_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
